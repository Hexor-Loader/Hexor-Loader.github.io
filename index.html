<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldHEN Multi FW - مكتب العراب</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .goldhen-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #ffd400;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 220ms ease, filter 220ms ease;
      transform: scale(1);
    }
    .goldhen-button img {
      display: block;
      width: clamp(170px, 35vw, 290px);
      height: clamp(170px, 35vw, 290px);
      object-fit: contain;
      border-radius: 50%;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 12px rgba(0, 105, 255, .48));
    }
    .goldhen-button span {
      font-size: clamp(19px, 3vw, 27px);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: .4px;
      text-align: center;
      text-shadow: 0 0 10px rgba(0, 105, 255, .75);
    }
    @media (hover: hover) and (pointer: fine) {
      .goldhen-button:hover {
        transform: scale(1.10);
        filter: brightness(1.12);
      }
    }
    .goldhen-button:active {
      transform: scale(.96);
    }
    .goldhen-button:focus-visible {
      outline: 2px solid #168cff;
      outline-offset: 12px;
      border-radius: 18px;
    }
  </style>
</head>
<body>
  <main class="screen">
    <button class="goldhen-button" type="button"
      aria-label="GoldHEN Multi FW"
      onclick="window.location.href='g2all/index.html'">
      <img src="hexor-icon.png" alt="مكتب العراب">
      <span>GoldHEN Multi FW</span>
    </button>
  </main>
</body>
</html>
