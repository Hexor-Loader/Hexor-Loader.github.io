<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PS4 5.05 - 7.00 - 14.02 FW GoldHEN</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

body {
    background: #02040c !important;
    background-image: none !important;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

/* إخفاء الشريط الأبيض */

hr {
    display: none !important;
}

/* شعار مكتب العراب */

.brand {
    width: 100%;
    margin-top: 45px;
    text-align: center;
}

.brand-name {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    font-size: clamp(32px, 5vw, 55px);
    font-weight: 900;

    color: #ffd400;

    text-shadow:
        0 0 8px rgba(255, 190, 0, .6),
        0 0 20px rgba(255, 150, 0, .35);

    letter-spacing: 2px;
}

.crown {
    font-size: clamp(35px, 5vw, 55px);
    filter: drop-shadow(0 0 8px rgba(255, 190, 0, .7));
}

/* الخط الاحترافي */

.brand-line {
    width: 70%;
    max-width: 600px;
    height: 1px;
    margin: 20px auto;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 212, 0, .9),
        transparent
    );

    box-shadow: 0 0 8px rgba(255, 212, 0, .3);
}

/* عنوان النظام */

.page-title {
    color: #e8e8e8;
    font-size: clamp(17px, 2.5vw, 25px);
    font-weight: bold;
    margin-top: 30px;
    text-shadow: 0 0 10px rgba(0, 110, 255, .5);
}

/* رسالة التشغيل */

#msgs {
    font-size: 30px;
    margin-top: 77px;
    margin-bottom: 455px;
    color: white;
    text-shadow: 0 0 12px rgba(0, 110, 255, .7);
}

/* الهواتف */

@media (max-width: 600px) {
    .brand {
        margin-top: 35px;
    }

    .brand-line {
        width: 85%;
    }

    #msgs {
        font-size: 23px;
        margin-top: 77px;
        margin-bottom: 455px;
    }
}
</style>

</head>

<body>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 14.02";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.02) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum == 11.50 || fwNum == 11.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.00 && fwNum <= 14.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>

<!-- شعار مكتب العراب -->

<header class="brand">

    <div class="brand-name">
        <span class="crown">👑</span>
        <span>مكتب العراب</span>
        <span class="crown">👑</span>
    </div>

    <div class="brand-line"></div>

</header>

<!-- عنوان GoldHEN -->

<h1 class="page-title">
    PS4 5.05 - 7.00 - 14.02 FW GoldHEN
</h1>

<!-- رسالة التشغيل الأصلية -->

<h1 id="msgs">
    Loading GoldHEN v2.4b18.14... Please Wait
</h1>

</body>
</html>
