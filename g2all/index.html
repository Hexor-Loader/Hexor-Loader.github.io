<style>
* {

}

html, body {

body {
    background: #02040c;

/* الخلفية */

.background {
    position: fixed;
    inset: 0;
    z-index: -2;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0, 35, 100, .18),
            transparent 65%
        ),
        radial-gradient(
            circle at 15% 20%,
            rgba(0, 80, 200, .16),
            transparent 40%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(0, 55, 150, .15),
            transparent 45%
        ),
        linear-gradient(135deg, #030b1b, #000 75%);
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            125deg,
            transparent 0px,
            transparent 130px,
            rgba(0, 110, 255, .045) 131px,
            transparent 133px
        );
}

/* الخطوط العلوية والسفلية */

.line {
    position: absolute;
    left: 3%;
    width: 94%;
    height: 1px;

    background: linear-gradient(
        90deg,

}

.top-line {

}

.bottom-line {

}

/* شعار المكتب */

.brand {

}

.brand-name {

    font-size: clamp(30px, 4vw, 48px);
    font-weight: 900;
    color: #ffd400;

    text-shadow:
        0 0 8px rgba(255,190,0,.5),
        0 0 20px rgba(255,150,0,.25);
}

.crown {
    font-size: clamp(30px, 4vw, 45px);
    filter: drop-shadow(0 0 7px rgba(255,190,0,.6));
}

/* عنوان النظام */

.page-title {
    position: absolute;
    top: 18%;
    width: 100%;

    margin: 0;
    padding: 0 15px;

    color: #e8e8e8;
    font-size: clamp(18px, 2.5vw, 27px);
    font-weight: bold;

    text-shadow: 0 0 10px rgba(0,110,255,.5);
}

/* رسالة التشغيل */

#msgs {
    position: absolute;
    top: 42%;
    left: 5%;
    right: 5%;

    margin: 0;
    padding: 15px;

    font-size: clamp(22px, 3vw, 34px);
    line-height: 1.7;
    font-weight: bold;

    color: #ffffff;

    text-shadow:
        0 0 10px rgba(0,110,255,.8),
        0 0 22px rgba(0,70,255,.4);
}

/* الشريط السفلي */

.footer {
    position: absolute;
    bottom: 30px;

    left: 5%;
    right: 5%;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;

    font-size: clamp(19px, 2vw, 27px);
    font-weight: bold;
}

/* العنوان */

.address {
    display: flex;
    align-items: center;
    gap: 10px;

    color: #ffd400;
    text-align: right;
    line-height: 1.5;

    text-shadow: 0 0 8px rgba(255,212,0,.3);
}

.address-icon {
    width: 32px;
    height: 32px;
    min-width: 32px;

    fill: #ffd400;
}

/* الهاتف */

.phone {
    display: flex;
    align-items: center;
    gap: 12px;

    direction: ltr;
    white-space: nowrap;

    color: white;
    font-size: clamp(21px, 2.3vw, 30px);
}

.footer-icons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.phone-icon {
    width: 29px;
    height: 29px;
    fill: white;
}

.whatsapp-icon {
    width: 34px;
    height: 34px;
    fill: #25D366;
}

/* شاشات صغيرة */

@media (max-width: 600px) {

    .brand {
        top: 45px;
    }

    .brand-name {
        font-size: 30px;
    }

    .page-title {
        top: 20%;
        font-size: 17px;
    }

    #msgs {
        top: 38%;
        font-size: 23px;
        line-height: 1.8;
    }

    .footer {
        bottom: 20px;
        flex-direction: column;
        gap: 12px;
        font-size: 17px;
    }

    .address {
        justify-content: center;
        text-align: center;
    }

    .phone {
        font-size: 21px;
    }

    .address-icon {
        width: 25px;
        height: 25px;
        min-width: 25px;
    }

    .phone-icon {
        width: 25px;
        height: 25px;
    }

    .whatsapp-icon {
        width: 29px;
        height: 29px;
    }

    .bottom-line {
        bottom: 110px;
    }
}
</style>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 14.02";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.02) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum == 11.50 || fwNum == 11.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.00 && fwNum <= 14.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
